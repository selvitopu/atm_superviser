name: atm-supervisor

services:
  postgres:
    image: postgres:18
    environment:
      TZ: UTC
      POSTGRES_DB: atmsup
      POSTGRES_USER: atmsup
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atmsup-demo}
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker, so the volume is mounted one level up
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmsup -d atmsup"]
      interval: 5s
      timeout: 5s
      retries: 20

  simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    environment:
      TZ: UTC
      ATM_DEMOMODE: "true"
      ATM_INVENTORY: /config/inventory.yml
      ATM_SIM_HOST: simulator
      ATM_TRAP_HOST: supervisor
      ATM_SIMULATOR_HTTP_ADDRESS: 0.0.0.0
      ATM_SIMULATOR_BINDHOST: 0.0.0.0
      ATM_SIMULATOR_DATA_DIR: /data
      SNMP_MONITOR_AUTH: ${SNMP_MONITOR_AUTH:-monitor-auth-demo}
      SNMP_MONITOR_PRIV: ${SNMP_MONITOR_PRIV:-monitor-priv-demo}
      SNMP_OPERATOR_AUTH: ${SNMP_OPERATOR_AUTH:-operator-auth-demo}
      SNMP_OPERATOR_PRIV: ${SNMP_OPERATOR_PRIV:-operator-priv-demo}
    volumes:
      - ../config:/config:ro
      - simulator-data:/data
    ports:
      - "127.0.0.1:16101-16107:16101-16107/udp"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /api/devices HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  supervisor:
    build:
      context: ..
      dockerfile: supervisor/Dockerfile
    environment:
      TZ: UTC
      ATM_DEMOMODE: "true"
      ATM_INVENTORY: /config/inventory.yml
      ATM_SIM_HOST: simulator
      ATM_SUPERVISOR_HTTP_ADDRESS: 0.0.0.0
      ATM_SUPERVISOR_BINDHOST: 0.0.0.0
      ATM_SUPERVISOR_DATA_DIR: /data
      ATM_SIMULATOR_CONSOLEURL: http://simulator:8090
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-atmsup-demo}
      SNMP_MONITOR_AUTH: ${SNMP_MONITOR_AUTH:-monitor-auth-demo}
      SNMP_MONITOR_PRIV: ${SNMP_MONITOR_PRIV:-monitor-priv-demo}
      SNMP_OPERATOR_AUTH: ${SNMP_OPERATOR_AUTH:-operator-auth-demo}
      SNMP_OPERATOR_PRIV: ${SNMP_OPERATOR_PRIV:-operator-priv-demo}
    volumes:
      - ../config:/config:ro
      - supervisor-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy

  ui:
    build:
      context: ..
      dockerfile: ui/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      supervisor:
        condition: service_healthy

volumes:
  postgres-data:
  simulator-data:
  supervisor-data:
