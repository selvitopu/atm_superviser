server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. With a variable in proxy_pass, nginx re-resolves the name (cached for 10 s), so a
    # recreated supervisor or simulator container with a new address is found without restarting this one.
    resolver 127.0.0.11 valid=10s;
    set $supervisor http://supervisor:8080;
    set $simulator http://simulator:8090;

    location / {
        try_files $uri /index.html;
    }

    location /api/v1/stream {
        proxy_pass $supervisor;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass $supervisor;
    }

    # A variable proxy_pass does no URI replacement: map /sim/api/... to the simulator's /api/... here.
    location /sim/api/ {
        rewrite ^/sim/api/(.*)$ /api/$1 break;
        proxy_pass $simulator;
    }
}
