name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  mib-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install smilint and the standard MIBs
        run: sudo apt-get update && sudo apt-get install -y smitools snmp-mibs-downloader
      - name: Lint the MIB
        run: cd mib && ./lint.sh
