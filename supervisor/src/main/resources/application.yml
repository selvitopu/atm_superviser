server:
  port: 8080
  address: ${ATM_SUPERVISOR_HTTP_ADDRESS:127.0.0.1}

management:
  server:
    port: 8081
    address: ${ATM_SUPERVISOR_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,metrics

spring:
  config:
    import: optional:file:${ATM_INVENTORY:../config/inventory.yml}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    # LiquibaseDemoContext switches this to "demo" in demo mode; if it is ever missed, no demo accounts are seeded
    contexts: default
    # Liquibase 5 otherwise fetches a remote analytics configuration on every run and may send usage data
    analytics-enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/atmsup
    username: ${DB_USER:atmsup}
    password: ${DB_PASSWORD:atmsup-demo}

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs
